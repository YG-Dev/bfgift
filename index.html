riends who also shared this interest  , someone that knows about it and is familiar with it, content creation is something that has been very important to me for years, and even though i havent had the chance to work on anything related to it recently, im just glad that i have you, and i hope to share things related to it with you someday and talk about it with you, a friend, and i feel like youre someone i can rely on who would help teach me somethings in regards to it, but also other skills, its  really nice to have someone  whose more experienced opinion i can get in these things i love, music and content, and youre someone who is so often willing to help your friends, sometimes too much in my opinion, and i hope that you know that youre loved regardless, and its okay to chill sometimes, and i hope you take good care of yourself, when it comes to friends, the one thing that often determines how valuable a friend to me and how much  i love and care about them, is how they have affected me and my life, but also how i affect them and their life, how they helped me improve but also how i helped them improve, as a person, or in a skill, anything, and i hope to someday, sometimes, be able to do that for you, and help you like you ve helped me.</p><p>and lastly, platonically, i love you, vyii, youre someone that deserves a lot of happiness in life, have a good birthday.</p>`,

          <button
            onclick="closeLetter()"
            class="absolute top-4 right-4 w-10 h-10 flex items-center justify-center bg-white/10 hover:bg-red-500/30 rounded-full transition text-gray-300 hover:text-white"
          >
            <i class="fas fa-times text-lg"></i>
          </button>

          <div id="modal-emoji" class="text-5xl mb-4 mt-6 floating">✉️</div>
          <h3 id="modal-sender" class="text-2xl font-bold text-pink-400 mb-6">
            From Friend
          </h3>

          <div
            class="bg-black/40 rounded-2xl p-6 border border-purple-500/10 mb-6 max-h-[25vh] overflow-y-auto"
          >
            <p
              id="modal-text"
              class="text-gray-200 text-lg leading-relaxed italic"
            ></p>
          </div>

          <div
            id="modal-audio-container"
            class="hidden w-full flex flex-col items-center p-4 bg-purple-900/30 rounded-2xl border border-purple-500/30 mb-4"
          >
            <p
              class="text-xs text-purple-200 uppercase tracking-widest font-extrabold mb-3 flex items-center gap-2"
            >
              <i class="fas fa-volume-up animate-pulse text-pink-400"></i> Voice
              Recording Attached
            </p>
            <audio id="modal-audio-player" controls class="w-full mt-1"></audio>
          </div>

          <button
            onclick="closeLetter()"
            class="px-6 py-2.5 bg-purple-600 hover:bg-purple-500 font-bold rounded-xl transition shadow-md"
          >
            Close Letter
          </button>
        </div>
      </div>

      <section
        id="sec-gallery"
        class="w-full max-w-5xl glass rounded-3xl p-6 md:p-10 shadow-2xl hidden"
      >
        <h2
          class="text-4xl font-extrabold text-center mb-10 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400"
        >
          Gifts & Drawings <span class="text-white">🎨</span>
        </h2>
        <div
          id="gallery-grid"
          class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 max-h-[50vh] overflow-y-auto p-1"
        ></div>
        <button
          onclick="nextSection()"
          class="mt-10 px-8 py-4 bg-white/90 text-black font-bold rounded-2xl text-lg hover:bg-purple-400 hover:text-white transition-all hover:scale-105 active:scale-95 flex items-center gap-3 mx-auto"
        >
          <span>Continue to Final Page</span>
          <i class="fas fa-arrow-down"></i>
        </button>
      </section>

      <div
        id="gallery-lightbox"
        class="fixed inset-0 z-50 bg-black/95 backdrop-blur-lg flex items-center justify-center p-4 hidden opacity-0 pointer-events-none"
      >
        <div class="max-w-4xl w-full flex flex-col items-center relative">
          <button
            onclick="closeLightbox()"
            class="absolute -top-12 right-0 w-10 h-10 flex items-center justify-center bg-white/10 hover:bg-red-500/40 rounded-full text-white z-50"
          >
            <i class="fas fa-times text-lg"></i>
          </button>

          <div
            class="w-full relative flex items-center justify-center min-h-[40vh] max-h-[70vh]"
          >
            <img
              id="lightbox-img-frame"
              src=""
              alt="View"
              class="max-w-full max-h-[65vh] object-contain rounded-2xl shadow-2xl hidden"
            />

            <video
              id="lightbox-video-frame"
              controls
              class="max-w-full max-h-[65vh] rounded-2xl shadow-2xl hidden"
            ></video>

            <button
              onclick="shiftCarousel(-1)"
              id="carousel-prev"
              class="absolute left-2 md:-left-16 w-12 h-12 flex items-center justify-center bg-black/60 border border-white/20 hover:bg-purple-600 rounded-full text-white cursor-pointer hidden"
            >
              <i class="fas fa-chevron-left text-lg"></i>
            </button>
            <button
              onclick="shiftCarousel(1)"
              id="carousel-next"
              class="absolute right-2 md:-right-16 w-12 h-12 flex items-center justify-center bg-black/60 border border-white/20 hover:bg-purple-600 rounded-full text-white cursor-pointer hidden"
            >
              <i class="fas fa-chevron-right text-lg"></i>
            </button>
          </div>

          <h4
            id="lightbox-title"
            class="text-2xl font-bold text-pink-400 mt-6 text-center"
          ></h4>
          <p
            id="lightbox-desc"
            class="text-sm text-gray-300 mt-1 max-w-xl text-center"
          ></p>

          <div id="carousel-dots" class="flex gap-2 mt-4 hidden"></div>
        </div>
      </div>

      <section
        id="sec-feedback"
        class="w-full max-w-xl glass rounded-3xl p-8 md:p-12 text-center shadow-2xl hidden relative"
      >
        <h2 class="text-4xl font-extrabold mb-4 text-white">
          Do you like your gift, Fifi? 🤔
        </h2>
        <p class="text-lg text-purple-300 mb-10">Be honest! Hahaha.</p>
        <div
          class="flex flex-wrap justify-center items-center gap-6 min-h-[80px]"
          id="rating-container"
        >
          <button
            onclick="handleRatingResponse('yes')"
            class="px-8 py-3 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold text-lg rounded-2xl shadow-lg hover:scale-110 transition duration-300"
          >
            OMG YES ! THIS IS THE BEST GIFT EVER 😍
          </button>
          <button
            onclick="handleRatingResponse('no')"
            id="btn-no"
            class="px-8 py-3 bg-gradient-to-r from-red-500 to-rose-600 text-white font-bold text-lg rounded-2xl shadow-lg transition duration-200"
          >
            Ew, no 😭
          </button>
        </div>
        <div
          id="rating-output"
          class="mt-8 text-2xl font-bold text-pink-400 min-h-[40px] animate__animated"
        ></div>
      </section>
    </main>

    <script>
      const sectionOrder = [
        "sec-hero",
        "sec-kiora",
        "sec-messages",
        "sec-gallery",
        "sec-feedback",
      ];
      let activeSectionIndex = 0;
      let runningNoCount = 0;
      let currentCarouselGroup = null;
      let currentCarouselIndex = 0;
      let backgroundAudio = null;

      function startBackgroundMusic() {
        // Instantiate background audio asset tracking loop safely if not already assigned
        if (!backgroundAudio && CONFIG.bgMusicUrl) {
          backgroundAudio = new Audio(CONFIG.bgMusicUrl);
          backgroundAudio.loop = true;
          backgroundAudio.volume = 0.4; // 40% ambient backing stream volume balance
          backgroundAudio
            .play()
            .catch((err) => console.log("Music track failure:", err));

          // Track when individual friend voice messages are playing to dim ambient backing track
          const friendVoicePlayer =
            document.getElementById("modal-audio-player");
          if (friendVoicePlayer) {
            friendVoicePlayer.onplay = () => {
              backgroundAudio.volume = 0.15;
            }; // Dim background music
            friendVoicePlayer.onpause = () => {
              backgroundAudio.volume = 0.4;
            }; // Restore volume
            friendVoicePlayer.onended = () => {
              backgroundAudio.volume = 0.4;
            };
          }
        }
      }

      function renderStaticText() {
        document.getElementById("ui-heroTitle").innerHTML =
          CONFIG.heroTitle +
          "<span class='text-white' style='-webkit-text-fill-color: white;'>🎉</span>";
        document.getElementById("ui-heroSubtitle").innerHTML =
          CONFIG.heroSubtitle;
        document.getElementById("ui-kioraMessage").textContent =
          CONFIG.kioraMessage;
        document.getElementById("ui-kioraSign").textContent =
          `— With lots of appreciation, Kio and your friends 💜`;
      }

      // Renders clean, interactive link-cards instead of immediately exposing the message text
      function renderMessages() {
        const container = document.getElementById("messages-grid");
        container.innerHTML = "";

        CONFIG.messages.forEach((msg, index) => {
          const card = document.createElement("div");
          // Styled like a beautiful decorative clickable envelope wrapper
          card.className =
            "glass bg-purple-900/10 rounded-2xl p-6 border border-purple-500/20 hover:border-pink-500/50 transition duration-300 hover:-translate-y-1.5 shadow-lg flex flex-col items-center justify-center cursor-pointer text-center group";
          card.innerHTML = `
                    <div class="text-4xl mb-3 transform group-hover:scale-110 transition duration-300">${msg.emoji || "✉️"}</div>
                    <div class="text-white font-bold text-base tracking-wide">${msg.from}</div>
                    <span class="text-xs text-purple-300 mt-2 bg-purple-950/50 px-3 py-1 rounded-full border border-purple-500/10 flex items-center gap-1">
                        Open Envelope ${msg.audioUrl ? '<i class="fas fa-microphone text-pink-400 text-[10px]"></i>' : ""}
                    </span>
                `;
          // Hooking dynamic click event to mount our stylized modular box renderer
          card.onclick = () => openLetter(index);
          container.appendChild(card);
        });
      }

      // Handles the letter popup modal action
      function openLetter(index) {
        const msg = CONFIG.messages[index];
        const modal = document.getElementById("letter-modal");
        const audioContainer = document.getElementById("modal-audio-container");
        const audioPlayer = document.getElementById("modal-audio-player");

        if (CONFIG.envelopeOpenSfx) {
          const openSound = new Audio(CONFIG.envelopeOpenSfx);
          openSound.volume = 0.6; // 60% volume balance
          openSound
            .play()
            .catch((e) =>
              console.log("Audio play blocked until interaction:", e),
            );
        }

        document.getElementById("modal-sender").textContent =
          `From: ${msg.from}`;
        document.getElementById("modal-text").textContent = msg.text;
        document.getElementById("modal-emoji").textContent = msg.emoji || "✉️";

        if (msg.audioUrl && msg.audioUrl.trim() !== "") {
          audioPlayer.src = msg.audioUrl;
          audioContainer.classList.remove("hidden");
        } else {
          audioPlayer.src = "";
          audioContainer.classList.add("hidden");
        }

        const scrollContainer =
          document.getElementById("modal-text").parentElement;
        if (scrollContainer) scrollContainer.scrollTop = 0;
        document.getElementById("modal-text").scrollTop = 0;

        modal.classList.remove("hidden", "pointer-events-none");
        modal.style.opacity = "1";
      }

      function closeLetter() {
        const modal = document.getElementById("letter-modal");
        const audioPlayer = document.getElementById("modal-audio-player");

        // Instantly halt audio feedback track if modal window bounds are dismissed
        audioPlayer.pause();
        audioPlayer.src = "";

        modal.style.opacity = "0";
        setTimeout(() => {
          modal.classList.add("hidden", "pointer-events-none");
        }, 300);
      }

      function renderGallery() {
        const container = document.getElementById("gallery-grid");
        container.innerHTML = "";

        CONFIG.galleryImages.forEach((item, index) => {
          const wrapper = document.createElement("div");
          wrapper.className =
            "glass rounded-2xl overflow-hidden shadow-md group relative aspect-square bg-black/40 border border-purple-500/20 cursor-pointer";

          // Establish preview source cover graphics
          const previewSrc =
            item.type === "video" ? item.thumbnail : item.urls[0];
          const badgeIcon =
            item.type === "video"
              ? "fa-video text-pink-400"
              : item.urls.length > 1
                ? "fa-images text-purple-400"
                : "fa-image text-gray-400";

          wrapper.innerHTML = `
                    <img src="${previewSrc}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                    <div class="absolute top-3 right-3 bg-black/70 px-2.5 py-1 rounded-lg border border-white/10 text-xs flex items-center gap-1.5 backdrop-blur-sm">
                        <i class="fas ${badgeIcon}"></i>
                        <span>${item.type === "video" ? "Video" : `${item.urls.length} Version${item.urls.length > 1 ? "s" : ""}`}</span>
                    </div>
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition duration-300 flex flex-col justify-end p-4 text-left">
                        <h5 class="font-bold text-sm text-pink-400">${item.title}</h5>
                        <p class="text-xs text-gray-300 truncate mt-0.5">${item.description}</p>
                    </div>
                `;

          if (item.type === "image" && !item.urls?.length) {
            wrapper.innerHTML = `
                    <div class="absolute top-3 right-3 bg-black/70 px-2.5 py-1 rounded-lg border border-white/10 text-xs flex items-center gap-1.5 backdrop-blur-sm">
                        <span>Artwork coming soon....</span>
                    </div>
                    `;
          }

          wrapper.onclick = () => openLightbox(index);
          container.appendChild(wrapper);
        });
      }

      // Lightbox Presentation Orchestrator
      function openLightbox(index) {
        const item = CONFIG.galleryImages[index];
        const modal = document.getElementById("gallery-lightbox");
        const imgFrame = document.getElementById("lightbox-img-frame");
        const videoFrame = document.getElementById("lightbox-video-frame");

        currentCarouselGroup = item;
        currentCarouselIndex = 0;

        document.getElementById("lightbox-title").textContent = item.title;
        document.getElementById("lightbox-desc").textContent = item.description;

        if (item.type === "video") {
          imgFrame.classList.add("hidden");
          videoFrame.classList.remove("hidden");
          videoFrame.src = item.videoUrl;

          // Hide carousel features completely for video files
          document.getElementById("carousel-prev").classList.add("hidden");
          document.getElementById("carousel-next").classList.add("hidden");
          document.getElementById("carousel-dots").classList.add("hidden");
        } else {
          videoFrame.classList.add("hidden");
          videoFrame.src = "";
          imgFrame.classList.remove("hidden");

          updateCarouselView();
        }

        modal.classList.remove("hidden", "pointer-events-none");
        modal.style.opacity = "1";
      }

      // Refreshes slide assets & builds relative pagination indicators
      function updateCarouselView() {
        const imgFrame = document.getElementById("lightbox-img-frame");
        imgFrame.src = currentCarouselGroup.urls[currentCarouselIndex];

        const prevBtn = document.getElementById("carousel-prev");
        const nextBtn = document.getElementById("carousel-next");
        const dotsContainer = document.getElementById("carousel-dots");

        if (currentCarouselGroup.urls.length > 1) {
          prevBtn.classList.remove("hidden");
          nextBtn.classList.remove("hidden");
          dotsContainer.classList.remove("hidden");

          // Regenerate tracking pagination points
          dotsContainer.innerHTML = "";
          currentCarouselGroup.urls.forEach((_, idx) => {
            const dot = document.createElement("div");
            dot.className = `w-2 h-2 rounded-full transition-all duration-200 ${idx === currentCarouselIndex ? "bg-pink-500 scale-125" : "bg-white/30"}`;
            dotsContainer.appendChild(dot);
          });
        } else {
          prevBtn.classList.add("hidden");
          nextBtn.classList.add("hidden");
          dotsContainer.classList.add("hidden");
        }
      }

      // Infinite loop slider traversal
      function shiftCarousel(direction) {
        if (!currentCarouselGroup || currentCarouselGroup.type !== "image")
          return;

        currentCarouselIndex += direction;
        if (currentCarouselIndex >= currentCarouselGroup.urls.length)
          currentCarouselIndex = 0;
        if (currentCarouselIndex < 0)
          currentCarouselIndex = currentCarouselGroup.urls.length - 1;

        updateCarouselView();
      }

      // Modal dismissal with memory buffer flush to halt video streaming
      function closeLightbox() {
        const modal = document.getElementById("gallery-lightbox");
        const videoFrame = document.getElementById("lightbox-video-frame");
        videoFrame.pause();
        videoFrame.src = ""; // Flush buffer
        modal.style.opacity = "0";
        setTimeout(
          () => modal.classList.add("hidden", "pointer-events-none"),
          300,
        );
      }

      function navigateToSection(targetIndex) {
        if (targetIndex < 0 || targetIndex >= sectionOrder.length) return;

        const overlay = document.getElementById("loading-overlay");
        overlay.classList.remove("hidden", "pointer-events-none");
        overlay.classList.remove("opacity-0");
        overlay.classList.add("opacity-100");

        setTimeout(() => {
          sectionOrder.forEach((id) => {
            document.getElementById(id).classList.add("hidden");
          });

          activeSectionIndex = targetIndex;
          const activeId = sectionOrder[activeSectionIndex];
          const activeTarget = document.getElementById(activeId);

          activeTarget.classList.remove("hidden");
          activeTarget.classList.add("animate__animated", "animate__fadeInUp");

          document.getElementById("btn-prev").style.display =
            activeSectionIndex === 0 ? "none" : "flex";
          document.getElementById("btn-next").style.display =
            activeSectionIndex === sectionOrder.length - 1 ? "none" : "flex";

          overlay.classList.remove("opacity-100");
          overlay.classList.add("opacity-0");

          setTimeout(() => {
            overlay.classList.add("hidden", "pointer-events-none");
          }, 400);
        }, 600);
      }

      function nextSection() {
        navigateToSection(activeSectionIndex + 1);
      }
      function prevSection() {
        navigateToSection(activeSectionIndex - 1);
      }

      function handleRatingResponse(choice) {
        const output = document.getElementById("rating-output");
        const noBtn = document.getElementById("btn-no");

        if (choice === "yes") {
          if (CONFIG.clickYesSfx) {
            const cheerSound = new Audio(CONFIG.clickYesSfx);
            cheerSound.volume = 0.7;
            cheerSound
              .play()
              .catch((e) => console.log("Audio play blocked:", e));
          }

          output.className =
            "mt-8 text-2xl font-bold text-pink-400 animate__animated animate__bounceIn";
          output.innerHTML =
            "Yeppiiii! Mission accomplished! Kio will be so happy! 🥳💜✨";
          noBtn.style.transform = "scale(1)";
          noBtn.style.opacity = "1";
        } else {
          runningNoCount++;
          output.className =
            "mt-8 text-xl font-bold text-purple-400 animate__animated animate__shakeX";

          switch (runningNoCount) {
            case 0:
              output.innerHTML = "";
              noBtn.style.transform = "scale(1)";
              break;
            case 1:
              output.innerHTML =
                "Oops! That doesn't seem like the right answer 🤔";
              noBtn.style.transform = "scale(0.92)";
              break;
            case 2:
              output.innerHTML =
                "Are you absolutely sure? Take another look! 👀";
              noBtn.style.transform = "scale(0.85)";
              break;
            case 3:
              output.innerHTML =
                "Hmm... I think you might want to reconsider that 😌";
              noBtn.style.transform = "scale(0.78)";
              break;
            case 4:
              output.innerHTML =
                "Error detected: Gift appreciation level too low, Try again ⚠️";
              noBtn.style.transform = "scale(0.72)";
              break;
            case 5:
              output.innerHTML = "Maybe your finger slipped ? Try again 😉";
              noBtn.style.transform = "scale(0.65)";
              break;
            case 6:
              output.innerHTML =
                "That's a suspicious choice... let's think about it one more time 🤨";
              noBtn.style.transform = "scale(0.58)";
              break;
            case 7:
              output.innerHTML =
                'The "No" button is getting worried. Are you sure? 😭';
              noBtn.style.transform = "scale(0.52)";
              break;
            case 8:
              output.innerHTML =
                "I spent a lot of love on this gift... try again? 🥺";
              noBtn.style.transform = "scale(0.45)";
              break;
            case 9:
              output.innerHTML =
                "System message: Only positive answers are recommended 💖";
              noBtn.style.transform = "scale(0.38)";
              break;
            default:
              output.innerHTML =
                "Bro stop being a Tsundere and pick YES already ! 😤✨";
              noBtn.style.display = "none";
              break;
          }
        }
      }

      function initApp() {
        renderStaticText();
        renderMessages();
        renderGallery();

        setInterval(() => {
          const hero = document.getElementById("sec-hero");
          if (hero.classList.contains("hidden")) return;

          const sparkle = document.createElement("div");
          sparkle.className = "sparkle";
          sparkle.style.left = Math.random() * 100 + "%";
          sparkle.style.top = Math.random() * 100 + "%";
          sparkle.style.animationDelay = Math.random() * 600 + "ms";
          hero.appendChild(sparkle);

          setTimeout(() => sparkle.remove(), 1600);
        }, 400);

        console.log(
          "%cApp successfully mounted with Audio Letter support! 💜",
          "color: #8b00ff; font-weight: bold;",
        );
      }

      window.onload = initApp;
    </script>
  </body>
</html>
